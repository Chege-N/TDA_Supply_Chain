version: "3.9"

services:
  api:
    build: .
    ports:
      - "7860:7860"          # host:container — both 7860, no confusion
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=7860
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  redis:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  benchmark:
    build: .
    command: python main.py benchmark --all
    depends_on:
      - api
    profiles:
      - benchmark

  notebook:
    build: .
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root notebooks/
    ports:
      - "8888:8888"
    profiles:
      - notebook

volumes:
  redis_data:
