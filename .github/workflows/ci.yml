name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy numpy scipy

      - name: Ruff (linting + formatting check)
        run: ruff check src/ tests/ --ignore E501,E402

      - name: Mypy (type check core)
        run: mypy src/core/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # advisory for now

  benchmark-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run benchmark smoke (suez_blockage, 20 steps)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.core.tda_engine import DynamicFilteredComplex, PersistentHomologyComputer
          from src.core.anomaly_detector import TopologicalAnomalyDetector
          from src.streaming.pipeline import GraphUpdater
          from src.data_gen.synthetic_generator import SyntheticDataGenerator

          gen = SyntheticDataGenerator(n_nodes=15, seed=42)
          cplx = DynamicFilteredComplex()
          comp = PersistentHomologyComputer()
          det = TopologicalAnomalyDetector(warmup_steps=8)
          updater = GraphUpdater(cplx)
          fp = 0
          for step in range(20):
              for e in gen.generate_step(step, disrupted=False):
                  updater.apply(e)
              if cplx.n_nodes >= 2:
                  diag = comp.update(cplx)
                  alert = det.step(diag, cplx)
                  if alert.is_anomaly: fp += 1
          assert fp / 20 < 0.10, f'FPR {fp/20:.1%} too high on normal data'
          print(f'Smoke test passed. FP={fp}/20 on normal-only data.')
          "

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tda-supply-chain:ci .

      - name: Test container health
        run: |
          docker run -d --name tda-test -p 8000:8000 tda-supply-chain:ci
          sleep 8
          curl -f http://localhost:8000/health || (docker logs tda-test && exit 1)
          docker stop tda-test
